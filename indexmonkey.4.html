<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <style>
    .container {
      display: flex;
      justify-content: center; /* Centers the first div */
      align-items: center; /* Aligns items vertically */
      position: relative;
      height: 100vh; /* Full viewport height */
    }

    .center-div {
      background-color: lightblue;
      padding: 20px;
      text-align: center;
    }

    .right-div {
      background-color: lightcoral;
      padding: 20px;
      margin-left: 10px; /* Space between the two divs */
      background-color: white;
    }
    div.settings {
      display: grid;
      grid-template-columns: max-content min-content; /* Let the second column grow */
      grid-gap: 5px;
    }

      div.settings input[type="text"] {
        width: auto; /* Ensure the input size respects its "size" attribute */
      }
  </style>
</head>

<body>
    <div class="container">
    <!-- Create the canvas that the C++ code will draw into -->
      <div class="center-div">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
      </div>
      <div class="right-div">
        <div class="settings">
          <label>Number of curves</label>
          <input type="text" id="numcurves" value="30" size="3"/>
          <label>Background color</label>
          <input type="text" id="bgcolor" value="FFFFFF" size="6"/>
          <label>Foregound color</label>
          <input type="text" id="fgcolor" value="0000FF" size="6" />
          <label>Rotate hue</label>
          <input type="checkbox" id="rotatehue" onchange="changerotatehue(this)" />
          <label>Speed of hue rotation</label>
          <input type="text" id="huespeed" value="1" />
          <label>Saturation of rotating hue (1-100)</label>
          <input type="text" id="huesat" value="100" size="3"/>
          <label>Brightness of rotating hue (1-100)</label>
          <input type="text" id="hueval" value="100" size="3" />
          <label>Contiguous over time</label>
          <input type="checkbox" onchange="changecontiguous" />
          <label>Number of points per curve in space</label>
          <input type="text" id="spacepoints" value="100" size="3"/>
          <label>Number of points per curve in time</label>
          <input type="text" id="timepoints" value="100" size="3"/>
          <br/>
          <button onclick="changetimepoints()">Change</button>
        </div>
      </div>
    </div>
    
    <!-- Allow the C++ to access the canvas element --> 
    <script type='text/javascript'>
        var Module = {
            canvas: (function() { return document.getElementById('canvas'); })()
        };
    </script>

    <!-- For itch.io -->
    <script type='text/javascript'>
        window.onload = function () { window.focus(); }
        window.onclick = function () { window.focus(); }
    </script>


    
    <!-- Add the javascript glue code (index.js) as generated by Emscripten -->
    <script src="wasm.js"></script>
    
</body>

</html>
