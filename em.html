<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style>
      .container {
        display: flex;
        justify-content: center; /* Centers the first div */
        align-items: center; /* Aligns items vertically */
        position: relative;
        height: 100vh; /* Full viewport height */
      }

      .center-div {
        background-color: lightblue;
        padding: 20px;
        text-align: center;
      }

      .right-div {
        background-color: lightcoral;
        padding: 20px;
        margin-left: 10px; /* Space between the two divs */
        background-color: white;
      }
      label {
        text-align: right;
        display: block; /* Ensures alignment applies in block-level context */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Create the canvas that the C++ code will draw into -->
      <div class="center-div">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" height="1000" width="1000"></canvas>
      </div>
      <div class="right-div">
        <table>
          <tr>
            <td><label>Number of curves:</label></td>
            <td><input type="text" id="numcurves" value="30" size="3" /></td>
          </tr>
          <tr>
            <td><label>Background color:</label></td>
            <td><input type="text" id="bgcolor" value="#FFFFFF" size="7" /></td>
          </tr>
          <tr>
            <td><label id="lblfgcolor">Foregound color:</label></td>
            <td><input type="text" id="txtfgcolor" value="#0000FF" size="7" /></td>
          </tr>
          <tr>
            <td><label>Rotate hue:</label></td>
            <td><input type="checkbox" id="rotatehue" onchange="changerotatehue()" /></td>
          </tr>
          <tr>
            <td><label style="color: #888888" id="lblhuespeed">Speed of hue rotation:</label></td>
            <td><input type="text" id="txthuespeed" value="1" size="3" style="color: #888888; border: 1px solid #888888" /></td>
          </tr>
          <tr>
            <td><label style="color: #888888" id="lblhuesat">Saturation of rotating hue (1-100):</label></td>
            <td><input type="text" id="txthuesat" value="100" size="3" style="color: #888888; border: 1px solid #888888" /></td>
          </tr>
          <tr>
            <td><label style="color: #888888" id="lblhueval">Brightness of rotating hue (1-100):</label></td>
            <td><input type="text" id="txthueval" value="100" size="3" style="color: #888888; border: 1px solid #888888" /></td>
          </tr>
          <tr>
            <td><label>Contiguous over time:</label></td>
            <td><input type="checkbox" id="contiguous" checked /></td>
          </tr>
          <tr>
            <td><label>Number of points per curve in space:</label></td>
            <td><input type="text" id="spacepoints" value="100" size="3" /></td>
          </tr>
          <tr>
            <td><label>Number of points per curve in time:</label></td>
            <td><input type="text" id="timepoints" value="100" size="3" /></td>
          </tr>
          <tr>
            <td />
            <td><button onclick="change()">Change</button></td>
          </tr>
        </table>
      </div>
    </div>

    <script type='text/javascript'>
      var Module = {
        canvas: (function () { return document.getElementById('canvas'); })()
      };
      w = 1000;
      h = 1000;
    </script>

    <script>
      function mainLoop()
      {
        Module.ccall('mainloop', null, [], []);
        var pixels = HEAPU8.subarray(pixelsptr, pixelsptr + w * h * 4);
        imagedata.data.set(pixels);
        ctx.putImageData(imagedata, 0, 0);
        requestAnimationFrame(mainLoop);
      }
    </script>

    <script>
      Module.onRuntimeInitialized = () =>
      {
        ctx = document.getElementById('canvas').getContext('2d');
        ctx.scale(1, 1);
        ctx.style = "width: 1000px; height: 1000px";
        imagedata = ctx.createImageData(1000, 1000);
        Module.ccall('main', null, [], []);
        pixelsptr = Module.ccall('getpixels', 'number', [], []);
        mainLoop();
      };
    </script>

    <!-- For itch.io -->
    <script type='text/javascript'>
      window.onload = function () { window.focus(); }
      window.onclick = function () { window.focus(); }
    </script>

    <script async type="text/javascript" src="em.js"></script>
    
    <script>
      function changerotatehue()
      {
        if (document.getElementById("rotatehue").checked)
        {
          element = document.getElementById("txtfgcolor");
          element.style.color = "#888888";
          element.style.border = "1px solid #888888";
          document.getElementById("lblfgcolor").style.color = "#888888";

          element = document.getElementById("txthuespeed");
          element.style.color = "#000000";
          element.style.border = "1px solid #000000";
          document.getElementById("lblhuespeed").style.color = "#000000";
          element = document.getElementById("txthuesat");
          element.style.color = "#000000";
          element.style.border = "1px solid #000000";
          document.getElementById("lblhuesat").style.color = "#000000";
          element = document.getElementById("txthueval");
          element.style.color = "#000000";
          element.style.border = "1px solid #000000";
          document.getElementById("lblhueval").style.color = "#000000";
        }
        else
        {
          element = document.getElementById("txtfgcolor");
          element.style.color = "#000000";
          element.style.border = "1px solid #000000";
          document.getElementById("lblfgcolor").style.color = "#000000";

          element = document.getElementById("txthuespeed");
          element.style.color = "#888888";
          element.style.border = "1px solid #888888";
          document.getElementById("lblhuespeed").style.color = "#888888";
          element = document.getElementById("txthuesat");
          element.style.color = "#888888";
          element.style.border = "1px solid #888888";
          document.getElementById("lblhuesat").style.color = "#888888";
          element = document.getElementById("txthueval");
          element.style.color = "#888888";
          element.style.border = "1px solid #888888";
          document.getElementById("lblhueval").style.color = "#888888";
        }
      }
    </script>
    <script>
      function change()
      {
        var txtnumcurves = document.getElementById("numcurves");
        var numcurves = parseInt(txtnumcurves.value);
        txtnumcurves.value = numcurves;

        var matchobj = document.getElementById("bgcolor").value.match("[#]?(\\w{2})(\\w{2})(\\w{2})");
        var ok = true;
        if (matchobj.length != 4)
        {
          document.getElementById("bgcolor").style.color = "FF0000";
          ok = false;
        }
        else
        {
          document.getElementById("bgcolor").style.color = "000000";
          var bgr = parseInt(matchobj[1], 16);
          var bgg = parseInt(matchobj[2], 16);
          var bgb = parseInt(matchobj[3], 16);
        }

        matchobj = document.getElementById("txtfgcolor").value.match("[#]?(\\w{2})(\\w{2})(\\w{2})");
        if (matchobj.length != 4)
        {
          document.getElementById("txtfgcolor").style.color = "FF0000";
          ok = false;
        }
        else
        {
          document.getElementById("txtfgcolor").style.color = "000000";
          var fgr = parseInt(matchobj[1], 16);
          var fgg = parseInt(matchobj[2], 16);
          var fgb = parseInt(matchobj[3], 16);
        }
        
        var rotatehue = document.getElementById("rotatehue").checked;

        var txthuespeed = document.getElementById("txthuespeed");
        var huespeed = parseInt(txthuespeed.value);
        txthuespeed.value = huespeed;

        var txthuesat = document.getElementById("txthuesat");
        var huesat = parseInt(txthuesat.value);
        txthuesat.value = huesat;

        var txthueval = document.getElementById("txthueval");
        var hueval = parseInt(txthueval.value);
        txthueval.value = hueval;

        var contiguous = document.getElementById("contiguous").checked;

        var spacepoints = document.getElementById("spacepoints");
        var spacepoints = parseInt(spacepoints.value);
        spacepoints.value = spacepoints;

        var timepoints = document.getElementById("timepoints");
        var timepoints = parseInt(timepoints.value);
        timepoints.value = timepoints;

        var result = Module.ccall('update', null, ['number', 'number', 'number', 'number', 'number', 'number', 'number', 'boolean', 'number', 'number', 'number', 'boolean', 'number', 'number'],
          [numcurves, bgr, bgg, bgb, fgr, fgg, fgb, !!rotatehue, huespeed, huesat, hueval, !!contiguous, spacepoints, timepoints]);
      }
    </script>
  </body>
</html>
