    <style>
      .container {
        display: flex;
        justify-content: center; /* Centers the first div */
        align-items: center; /* Aligns items vertically */
        position: relative;
        height: 100vh; /* Full viewport height */
      }

      .center-div {
        background-color: lightblue;
        padding: 20px;
        text-align: center;
      }

      .right-div {
        background-color: lightcoral;
        padding: 20px;
        margin-left: 10px; /* Space between the two divs */
        background-color: white;

      label {
        text-align: right;
        display: block; /* Ensures alignment applies in block-level context */
      }

    <div class="container">
      <!-- Create the canvas that the C++ code will draw into -->
      <div class="center-div">
        <canvas id="canvas" width="1000" height="1000" oncontextmenu="event.preventDefault()"></canvas>
      </div>
      <div class="right-div">
        <table>
          <tr>
            <td><label>Number of curves:</label></td>
            <td><input type="text" id="numcurves" value="30" size="3" /></td>
          </tr>
          <tr>
            <td><label>Background color:</label></td>
            <td><input type="text" id="bgcolor" value="#FFFFFF" size="7" /></td>
          </tr>
          <tr>
            <td><label id="lblfgcolor">Foregound color:</label></td>
            <td><input type="text" id="txtfgcolor" value="#0000FF" size="7" /></td>
          </tr>
          <tr>
            <td><label>Rotate hue:</label></td>
            <td><input type="checkbox" id="rotatehue" onchange="changerotatehue()" /></td>
          </tr>
          <tr>
            <td><label style="color: #888888" id="lblhuespeed">Speed of hue rotation:</label></td>
            <td><input type="text" id="txthuespeed" value="1" size="3" style="color: #888888; border: 1px solid #888888" /></td>
          </tr>
          <tr>
            <td><label style="color: #888888" id="lblhuesat">Saturation of rotating hue (1-100):</label></td>
            <td><input type="text" id="txthuesat" value="100" size="3" style="color: #888888; border: 1px solid #888888" /></td>
          </tr>
          <tr>
            <td><label style="color: #888888" id="lblhueval">Brightness of rotating hue (1-100):</label></td>
            <td><input type="text" id="txthueval" value="100" size="3" style="color: #888888; border: 1px solid #888888" /></td>
          </tr>
          <tr>
            <td><label>Contiguous over time:</label></td>
            <td><input type="checkbox" id="contiguous" checked /></td>
          </tr>
          <tr>
            <td><label>Number of points per curve in space:</label></td>
            <td><input type="text" id="spacepoints" value="100" size="3" /></td>
          </tr>
          <tr>
            <td><label>Number of points per curve in time:</label></td>
            <td><input type="text" id="timepoints" value="100" size="3" /></td>
          </tr>
          <tr>
            <td />
            <td><button onclick="change()">Change</button></td>
          </tr>
        </table>
      </div>
    </div>

      function make_environment(...envs)
      {
        return new Proxy(envs, {
          get(target, prop, receiver)
          {
            for (let env of envs)
            {
              if (env.hasOwnProperty(prop))
              {
                return env[prop];
              }
            }
            return (...args) => { console.error("NOT IMPLEMENTED: " + prop, args) }
          }
        });

    <script>
      function changerotatehue()
      {
        if (document.getElementById("rotatehue").checked)
        {
          element = document.getElementById("txtfgcolor");
